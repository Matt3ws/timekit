name: Release

# When CI passes on main, a version in src-tauri/tauri.conf.json that has no
# GitHub release yet (plus a matching "## <version>" section in CHANGELOG.md)
# publishes a release: a signed universal .dmg and the Windows installer,
# plus the signed update bundles and latest.json the in-app updater reads.
# Bump it with `pnpm bump <version>`. Merges without a bump release nothing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and notes
    # Only a green CI run for a push to main (not a PR run from a branch named main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version
        id: version
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "v${{ steps.version.outputs.version }} is already released, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.check.outputs.exists == 'false'
        run: |
          awk -v heading="## ${{ steps.version.outputs.version }}" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section"; exit 1; }

      - if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - name: Windows
            os: windows-latest
            rust-targets: ""
            args: --bundles nsis
            bundle: src-tauri/target/release/bundle/nsis/*.exe*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile

      # Self-signed certificate, the same for every release, so macOS sees
      # each update as the same app (keychain access and permissions survive).
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.TIMEKIT_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.TIMEKIT_CERT_PASSWORD }}
        run: |
          test -n "$CERT_P12" || { echo "The TIMEKIT_CERT_P12 secret is missing"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        shell: bash
        env:
          # Tauri signs the .app inside the .dmg with this identity (macOS only).
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && 'TimeKit Code Signing (Christian Tang Christensen)' || '' }}
          # Signs the update bundles (.app.tar.gz, setup .exe) for the in-app updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TIMEKIT_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TIMEKIT_UPDATER_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "The TIMEKIT_UPDATER_KEY secret is missing"; exit 1; }
          pnpm tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # A release must never ship an unsigned or ad-hoc signed Mac app.
      - name: Verify signature
        if: runner.os == 'macOS'
        run: |
          # Check the app inside the .dmg (the update bundle is built from the same .app).
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          codesign --verify --deep --strict "$mnt/TimeKit.app"
          codesign -dvv "$mnt/TimeKit.app" 2>&1 | grep -q "Authority=TimeKit Code Signing (Christian Tang Christensen)"
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: TimeKit-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      # Every file in one folder (artifacts keep their bundle/ subfolders).
      - run: mkdir artifacts && find downloads -type f -exec mv {} artifacts/ \;
      # What the in-app updater reads: one universal Mac bundle serves both
      # architectures. Asset URLs are where `gh release create` puts them.
      - name: Write latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/v${{ needs.prepare.outputs.version }}
        run: |
          cd artifacts
          mac="$(ls *.app.tar.gz)"
          win="$(ls *.exe)"
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$BASE/$mac" --rawfile mac_sig "$mac.sig" \
            --arg win_url "$BASE/$win" --rawfile win_sig "$win.sig" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { url: $mac_url, signature: ($mac_sig | rtrimstr("\n")) },
                "darwin-x86_64": { url: $mac_url, signature: ($mac_sig | rtrimstr("\n")) },
                "windows-x86_64": { url: $win_url, signature: ($win_sig | rtrimstr("\n")) }
              }
            }' > latest.json
          cat latest.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ needs.prepare.outputs.version }}" \
            artifacts/*.dmg artifacts/*.app.tar.gz artifacts/*.exe artifacts/latest.json \
            --target "${{ needs.prepare.outputs.sha }}" \
            --title "TimeKit ${{ needs.prepare.outputs.version }}" \
            --notes-file artifacts/notes.md
